name: release

on:
  push:
    branches: [main]
    paths: ["src/Blackout/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release. Leave empty to increment the patch."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Pick the version
        id: version
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.version }}"
          if [ -n "$requested" ]; then
            version="$requested"
          else
            latest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
            latest="${latest:-1.0.0}"
            IFS=. read -r major minor patch _ <<< "$latest"
            version="$major.$minor.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Download the Dalamud libraries
        run: |
          set -euo pipefail
          sdk_major=$(grep -oP 'Dalamud\.NET\.Sdk/\K[0-9]+' src/Blackout/Blackout.csproj)
          stable_major=$(curl -s https://goatcorp.github.io/dalamud-distrib/version \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['AssemblyVersion'].split('.')[0])")
          if [ "$sdk_major" -gt "$stable_major" ]; then
            url="https://goatcorp.github.io/dalamud-distrib/api${sdk_major}/latest.zip"
          else
            url="https://goatcorp.github.io/dalamud-distrib/latest.zip"
          fi
          echo "Using $url"
          curl -sL -o dalamud.zip "$url"
          unzip -q dalamud.zip -d dalamud

      - name: Build
        env:
          DALAMUD_HOME: ${{ github.workspace }}/dalamud
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build src/Blackout/Blackout.csproj -c Release -o out -p:RestoreLockedMode=true -p:Version="$VERSION"

      - name: Collect the plugin package
        run: cp out/Blackout/latest.zip Blackout.zip

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Blackout.zip

      - name: Update pluginmaster.json
        run: |
          python3 - <<'PY'
          import json, time

          manifest = json.load(open("out/Blackout.json"))
          entries = json.load(open("pluginmaster.json"))
          entry = entries[0]
          entry["AssemblyVersion"] = manifest["AssemblyVersion"]
          entry["DalamudApiLevel"] = manifest["DalamudApiLevel"]
          entry["LastUpdate"] = int(time.time())
          json.dump(entries, open("pluginmaster.json", "w"), indent=2)
          open("pluginmaster.json", "a").write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --cached --quiet && exit 0
          git commit -m "Update pluginmaster.json for ${{ steps.version.outputs.version }}"
          git push origin HEAD:main
